name: Weekly AI news reel (agents)

on:
  schedule:
    - cron: "17 22 * * 0"   # 매주 월요일 07:17 (한국시간)
  workflow_dispatch:
    inputs:
      style:
        description: "디자인 (A: 속보 / B: 신문)"
        type: choice
        options: [A, B]
        default: A
      topic:
        description: "특정 주제 (비우면 이번 주 AI 뉴스 전체)"
        type: string
        required: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Check secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY 시크릿이 없어요. Settings > Secrets and variables > Actions 에 등록해 주세요."
            exit 1
          fi
      - name: Agents (research -> write -> hook -> human tone -> fact-check -> caption)
        id: agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STYLE: ${{ inputs.style || 'A' }}
          TOPIC: ${{ inputs.topic }}
        run: |
          ARGS=(--style "$STYLE")
          if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          set -o pipefail
          python agents/pipeline.py "${ARGS[@]}" | tee agents.log
          echo "script=$(grep -oE 'scripts/[^ ]+\.json' agents.log | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Render
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python reel.py "${{ steps.agents.outputs.script }}" --out output
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add scripts reports output
          git commit -m "Weekly reel: ${{ steps.agents.outputs.script }} [skip ci]"
          git pull --rebase -q
          git push
